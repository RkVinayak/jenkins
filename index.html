
<!DOCTYPE html>
<html>
<head>
    <title>Jenkins Demo</title>
</head>

<body style="background-color: #f0f4f8; font-family: Arial; text-align: center; padding: 50px;">

    <h1 style="color: #2563eb; font-size: 36px;">
        Welcome to Jenkins!
    </h1>

    <h2 style="color: #333;">
        My First Jenkins Project
    </h2>

    <p style="color: #555; font-size: 18px;">
        Jenkins is an automation server used for CI/CD.
    </p>

    <button

        border: none;
        border-radius: 8px;
        font-size: 16px;
        cursor: pointer;"
        onclick="alert('Jenkins is Working Successfully!')">

        Click Me
    </button>

    <h3 style="color: green; margin-top: 30px;">
        Build Status: SUCCESS
    </h3>

</body>
</html>
